[package]
name = "sheaf-engine"
description = "Sheaf engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
sheaf-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
sheaf-render = { workspace = true }
sheaf-cos = { workspace = true }
sheaf-organize = { workspace = true }
sheaf-annot = { workspace = true }
sheaf-forms = { workspace = true }
sheaf-xfa = { workspace = true }
sheaf-edit = { workspace = true }
sheaf-content = { workspace = true }
sheaf-audit = { workspace = true }
sheaf-redact = { workspace = true }
sheaf-print = { workspace = true }
sheaf-xfdf = { workspace = true }
sheaf-sign = { workspace = true }
sheaf-optimize = { workspace = true }
sheaf-a11y = { workspace = true }
sheaf-ocr = { workspace = true }
sheaf-js = { workspace = true }
sheaf-compare = { workspace = true }
sheaf-preflight = { workspace = true }
sheaf-export = { workspace = true }
sheaf-fonts = { workspace = true }
sheaf-create = { workspace = true }
sheaf-model = { workspace = true }
sheaf-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and sheaf-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
sheaf-testkit = { workspace = true }
# JBIG2 fixtures (`encode_jbig2_generic`).
sheaf-filters = { workspace = true }
