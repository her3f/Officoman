<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 80" width="270" height="80" role="img" aria-labelledby="omw-title">
  <title id="omw-title">White Office</title>
  <defs>
    <linearGradient id="omwTile" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#33439B"/>
      <stop offset="1" stop-color="#0F1433"/>
    </linearGradient>
    <clipPath id="omwClip">
      <rect x="4" y="4" width="56" height="56" rx="15"/>
    </clipPath>
  </defs>

  <g transform="translate(8 14) scale(0.85)">
    <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#omwTile)"/>
    <g clip-path="url(#omwClip)">
      <path d="M36 4 H60 V28 Z" fill="#F2B33D" fill-opacity="0.92"/>
    </g>
    <rect x="4.5" y="4.5" width="55" height="55" rx="14.5" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.16"/>
    <circle cx="29" cy="35" r="11.5" fill="none" stroke="#F7F5EF" stroke-width="5.2"/>
  </g>

  <text x="76" y="52"
        font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif"
        font-size="33" font-weight="700" letter-spacing="-0.6" fill="#FFFFFF">White Office</text>
</svg>
