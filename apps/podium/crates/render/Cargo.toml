[package]
name = "podium-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Podium renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
podium-geom = { workspace = true }
podium-color = { workspace = true }
podium-metafile = { workspace = true }
podium-model = { workspace = true }
podium-anim = { workspace = true }
podium-fonts = { workspace = true }
podium-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }
skrifa = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
