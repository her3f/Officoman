[package]
name = "podium-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Podium engine: sessions, undo history, selection, the command registry every frontend dispatches through, and pointer tools"

[lints]
workspace = true

[dependencies]
podium-geom = { workspace = true }
podium-color = { workspace = true }
podium-model = { workspace = true }
podium-fonts = { workspace = true }
podium-text = { workspace = true }
podium-render = { workspace = true }
podium-pdf = { workspace = true }
podium-format = { workspace = true }
podium-pptx = { workspace = true }
podium-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
i_overlay = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
podium-anim = { workspace = true }
zip = { workspace = true }

# The browser clock for comment timestamps (wasm has no std::time::SystemTime).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

