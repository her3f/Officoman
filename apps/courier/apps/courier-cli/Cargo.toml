[package]
name = "courier-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Courier command line: inspect, import, export, convert, run commands, Send/Receive, MCP server"

[[bin]]
name = "courier-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
courier-time = { workspace = true }
courier-model = { workspace = true }
courier-engine = { workspace = true }
courier-mcp = { workspace = true }
courier-net = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Synthetic .pst files for `tests/import_pst.rs` (the reader's test writer, a dev-only feature).
courier-pst = { workspace = true, features = ["test-writer"] }
# The fake mail servers of `crates/net` (included by path in `tests/two_way.rs`) speak base64 (`courier-charset`).
courier-charset = { workspace = true }
# The Graph stand-in, for `tests/graph_folders.rs`: in a test's build only.
courier-net = { workspace = true, features = ["stand-in"] }
# The JMAP client and its server in the process, for `tests/jmap_mail.rs` and `tests/jmap_loopback.rs`:
# in a test's build only.
courier-jmap = { workspace = true, features = ["stand-in"] }
