[package]
name = "courier-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Courier host services below the window: what a platform gives the program (credential store, and more)"

[lints]
workspace = true

[features]
# The seams the flow tests of the app run through (a renewal of their own): a test's build only.
test-support = []

[dependencies]
log = { workspace = true }
# The engine's own memory cap, which the device's budget is held against.
courier-engine = { workspace = true }
# The words a to-do job's answer is said in (the engine's, in the owner's language).
courier-i18n = { workspace = true }
courier-model = { workspace = true }
# The jobs the host runs: what they are told and what they bring back, and the requests (empty in the browser).
courier-net = { workspace = true }
courier-time = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
