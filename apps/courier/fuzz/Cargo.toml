# Fuzz targets for the code that reads what arrives from outside: messages, mbox files, HTML,
# iCalendar, vCard, .pst files, OpenPGP signatures and keys, S/MIME Digital signatures, mailbox files, character sets, IMAP/SMTP servers, JMAP servers, gpg-agent and language catalogues. Not part of the
# main workspace (it needs nightly): `cargo +nightly fuzz run <target>` from the repository root;
# `cargo fuzz list` names them.
[package]
name = "courier-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
courier-assuan = { path = "../crates/assuan" }
courier-dav = { path = "../crates/dav" }
# Mailbox files in every form (`mailbox_file`), with the small limits of its tests.
courier-engine = { path = "../crates/engine", features = ["test-support"] }
libfuzzer-sys = "0.4"
courier-charset = { path = "../crates/charset" }
courier-i18n = { path = "../crates/i18n" }
courier-html = { path = "../crates/html" }
courier-ical = { path = "../crates/ical" }
courier-jmap = { path = "../crates/jmap" }
courier-ews = { path = "../crates/ews" }
courier-link = { path = "../crates/link" }
courier-mime = { path = "../crates/mime" }
courier-mime-model = { path = "../crates/mime-model" }
courier-model = { path = "../crates/model" }
courier-openpgp = { path = "../crates/openpgp" }
courier-proto = { path = "../crates/proto" }
courier-pst = { path = "../crates/pst" }
courier-smime = { path = "../crates/smime" }
courier-vcard = { path = "../crates/vcard" }

# Its own workspace, so the main one's builds, lints and cargo-deny leave it alone.
[workspace]

[[bin]]
name = "mime"
path = "fuzz_targets/mime.rs"
test = false
doc = false
bench = false

