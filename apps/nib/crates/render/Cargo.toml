[package]
name = "nib-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nib rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
nib-geom = { workspace = true, features = ["image"] }
nib-doc = { workspace = true }
nib-fonts = { workspace = true }
nib-layout = { workspace = true }
nib-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
